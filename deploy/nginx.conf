# 落音 LoyinMusic — nginx reverse proxy configuration
# Usage: ln -s /path/to/this/file /etc/nginx/sites-enabled/loyin
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name music.example.com;  # ← Change to your domain

    # Redirect to HTTPS (uncomment after obtaining SSL cert)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:5088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for future real-time sync)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Large file uploads (source scripts)
        client_max_body_size 10m;
    }

    # Cache static assets
    location /static/ {
        proxy_pass http://127.0.0.1:5088/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Stream audio without buffering
    location /api/local/stream/ {
        proxy_pass http://127.0.0.1:5088;
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}

