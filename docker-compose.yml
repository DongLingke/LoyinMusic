version: "3.8"

services:
  loyin:
    build: .
    ports:
      - "5088:5088"
    volumes:
      - loyin_data:/app/data
    environment:
      - PORT=5088
      - HOST=0.0.0.0
      # Uncomment to enable password protection:
      # - LOYIN_TOKEN=your_password_here
    restart: unless-stopped

volumes:
  loyin_data:
