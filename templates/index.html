<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>听迹 Tunenote</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-brand">🎵 听迹</div>
      <div class="sidebar-nav">
        <button class="nav-item active" data-view="local">
          <span class="nav-icon">💿</span><span class="nav-label">本地</span>
        </button>
        <button class="nav-item" data-view="online">
          <span class="nav-icon">🌐</span><span class="nav-label">在线</span>
        </button>
        <button class="nav-item" data-view="tags">
          <span class="nav-icon">🏷</span><span class="nav-label">标签</span>
        </button>
        <button class="nav-item" data-view="playlists">
          <span class="nav-icon">📋</span><span class="nav-label">歌单</span>
        </button>
        <button class="nav-item" data-view="history">
          <span class="nav-icon">📅</span><span class="nav-label">历史</span>
        </button>
        <button class="nav-item" data-view="settings">
          <span class="nav-icon">⚙</span><span class="nav-label">设置</span>
        </button>
      </div>
    </nav>
    <main id="main-content">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Player bar — fixed at bottom -->
  <div id="player-bar">
    <div class="player-track-info">
      <div class="player-cover" id="player-cover"></div>
      <div class="player-meta">
        <div class="player-title" id="player-title">未在播放</div>
        <div class="player-artist" id="player-artist"></div>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn" id="btn-prev" title="上一首">⏮</button>
      <button class="player-btn play-btn" id="btn-play" title="播放">▶</button>
      <button class="player-btn" id="btn-next" title="下一首">⏭</button>
    </div>
    <div class="player-progress-wrap">
      <span class="player-time" id="player-time-cur">0:00</span>
      <input type="range" class="player-progress" id="player-progress" min="0" max="100" value="0" step="0.1">
      <span class="player-time" id="player-time-dur">0:00</span>
    </div>
    <div class="player-extra">
      <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
    </div>
  </div>

  <!-- Fullscreen now-playing / lyrics overlay (M6) -->
  <div id="now-playing-overlay" class="np-overlay hidden">
    <button class="np-close" id="np-close">✕</button>
    <div class="np-cover" id="np-cover-lg"></div>
    <div class="np-info">
      <div class="np-title" id="np-title-lg"></div>
      <div class="np-artist" id="np-artist-lg"></div>
      <div class="np-album" id="np-album-lg"></div>
    </div>
    <div class="np-lyrics" id="np-lyrics"></div>
    <div class="np-note-area">
      <textarea class="np-note" id="np-note" placeholder="写点笔记...（自动保存）"></textarea>
    </div>
  </div>

  <audio id="audio-el" preload="auto"></audio>

  <script src="/static/js/sandbox/host.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
