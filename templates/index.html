<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>落音 LoyinMusic</title>
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="theme-dark">
  <div id="app">
    <!-- Wallpaper layer -->
    <div id="wallpaper"></div>

    <!-- Glass card -->
    <main id="card-wrapper">
      <div class="glass-layer"></div>
      <div class="card-content">
        <!-- Header: nav tabs + title -->
        <div class="card-header">
          <div class="header-nav">
            <button class="nav-btn active" data-view="local"><span class="nav-ico">💿</span><span class="nav-txt">本地</span></button>
            <button class="nav-btn" data-view="online"><span class="nav-ico">🌐</span><span class="nav-txt">在线</span></button>
            <button class="nav-btn" data-view="tags"><span class="nav-ico">🏷</span><span class="nav-txt">标签</span></button>
            <button class="nav-btn" data-view="playlists"><span class="nav-ico">📋</span><span class="nav-txt">歌单</span></button>
            <button class="nav-btn" data-view="history"><span class="nav-ico">📅</span><span class="nav-txt">历史</span></button>
            <button class="nav-btn" data-view="stats"><span class="nav-ico">📊</span><span class="nav-txt">统计</span></button>
            <button class="nav-btn" data-view="settings"><span class="nav-ico">⚙</span><span class="nav-txt">设置</span></button>
          </div>
        </div>

        <!-- Main view container -->
        <div id="view-container"></div>

        <!-- Player bar at bottom of card -->
        <div id="player-bar">
          <div class="player-track-info" id="player-info-clickable">
            <div class="player-cover" id="player-cover"></div>
            <div class="player-meta">
              <div class="player-title" id="player-title">未在播放</div>
              <div class="player-artist" id="player-artist"></div>
            </div>
          </div>
          <div class="player-controls">
            <button class="player-btn small" id="btn-shuffle" title="随机播放">🔀</button>
            <button class="player-btn" id="btn-prev" title="上一首">⏮</button>
            <button class="player-btn play-btn" id="btn-play" title="播放">▶</button>
            <button class="player-btn" id="btn-next" title="下一首">⏭</button>
            <button class="player-btn small" id="btn-repeat" title="循环">🔁</button>
          </div>
          <div class="player-progress-wrap">
            <span class="player-time" id="player-time-cur">0:00</span>
            <input type="range" class="player-progress" id="player-progress" min="0" max="100" value="0" step="0.1">
            <span class="player-time" id="player-time-dur">0:00</span>
          </div>
          <div class="player-extra">
            <button class="player-btn small" id="btn-fav" title="喜欢">♡</button>
            <button class="player-btn small" id="btn-speed" title="倍速" style="font-size:0.65rem">1x</button>
            <button class="player-btn small" id="btn-queue" title="播放队列">📜</button>
            <span class="vol-ico">🔊</span>
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="80">
          </div>
        </div>

        <!-- Queue panel -->
        <div id="queue-panel" class="queue-panel hidden">
          <div class="queue-head">
            <span>播放队列</span>
            <button id="btn-clear-queue" class="btn btn-ghost" style="font-size:0.72rem;padding:2px 8px">清空</button>
          </div>
          <div id="queue-list" class="queue-list"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Fullscreen now-playing / lyrics overlay (M6) -->
  <div id="now-playing-overlay" class="np-overlay hidden">
    <button class="np-close" id="np-close">✕</button>
    <div class="np-cover" id="np-cover-lg"></div>
    <div class="np-info">
      <div class="np-title" id="np-title-lg"></div>
      <div class="np-artist" id="np-artist-lg"></div>
      <div class="np-album" id="np-album-lg"></div>
    </div>
    <canvas id="np-visualizer" class="np-visualizer" width="300" height="60"></canvas>
    <div class="np-lyrics" id="np-lyrics"></div>
    <div class="np-note-area">
      <textarea class="np-note" id="np-note" placeholder="写点笔记...（自动保存）"></textarea>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <audio id="audio-el" preload="auto"></audio>

  <script src="/static/js/sandbox/host.js"></script>
  <script src="/static/js/app.js"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/static/sw.js').catch(()=>{});</script>
</body>
</html>
